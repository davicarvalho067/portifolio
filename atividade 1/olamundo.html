<style>
button {
  background: linear-gradient(135deg, #FFD700, #A020F0);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 24px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 15px #A020F066;
  transition: 0.3s ease;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 20px #FFD700;
}

button:active {
  transform: scale(0.95);
}
</style>
